# Activate bt_action_server via nav2_lifecycle_manager. Upstream
# epsilon_crane_behavior_tree/default.yaml used to carry the
# lifecycle_manager block; master dropped it, so CBS owns the
# definition here.
lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names: ["bt_action_server"]
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0

/**:
  ros__parameters:
    # Operator-panel residual light: green at or below this translation
    # residual, red above.  This is deliberately looser than the 4 cm
    # correction tolerance used by the tree.
    placement_indicator_threshold_m: 0.10
    # Simulation test hook.  Gazebo launch arguments override these values;
    # disabled by default and never enabled by the real-crane launch.
    simulated_placement_disturbance.enabled: false
    simulated_placement_disturbance.x_m: 0.06
    simulated_placement_disturbance.y_m: -0.04
    simulated_placement_disturbance.z_m: 0.00
    simulated_placement_disturbance.yaw_rad: 0.035
    plugin_lib_names:
      # epsilon_crane_behavior_tree
      - BT_wait_log_msg_decorator
      - BT_wait_grip_msg_decorator
      - BT_consume_log_array_decorator
      - BT_consume_pose_array_decorator
      - BT_follow_joint_trajectory_action
      - BT_calc_grip_movement_bt_node
      - BT_calc_a2b_movement_bt_node
      - BT_calculate_target_bt_node
      - BT_get_laydown_pose_bt_node
      - BT_calc_grip_state_bt_node
      - BT_get_user_approval_decorator
      - BT_check_user_approval_condition
      - BT_wait_goal_pose_decorator
      - BT_wait_goal_pose_array_decorator
      - BT_set_goal_pose_bt_node
      - BT_optimize_target_angle_bt_node
      - BT_switch_controller_action
      - BT_extract_goal_pose_bt_node
      - BT_iterate_log_array_bt_node
      - BT_pop_pose_array_bt_node
      - BT_change_lifecycle_state_action
      - BT_call_service_empty_action
      - BT_remove_log_from_aggregator_node
      # concrete_block_behavior_tree
      - BT_cb_get_next_assembly_task_action
      - BT_cb_set_block_task_status_action
      - BT_cb_wait_for_grasp_signal_condition
      - BT_cb_capture_block_grasp_offset_action
      - BT_cb_write_block_pose_from_gripper_action
      - BT_cb_plan_complete_condition
      - BT_cb_wait_for_operator_command_action
      - BT_cb_run_pose_estimation_action
      - BT_cb_evaluate_placement_residual_action
      - BT_cb_evaluate_pickup_residual_action
      - BT_cb_publish_gripper_state_action
      - BT_cb_add_c3_feedforward_action

    # C3's dynamic feedforward, written into the trajectory's effort field by AddC3Feedforward
    # and consumed by the JTC as a feedforward term (crane_controller_hydraulic_a2b_jtc_pid_pzs100
    # sets effort_field_is_feedforward). Off by default: with `enabled: false` the node hands the
    # trajectory on untouched and the controller runs today's static velocity feedforward.
    #
    # k is C3's actuator stiffness per axis, from wiki/diagrams/hydraulic_calibration/
    # c3_full_model.json (refit 2026-09-04; check its mtime against these numbers). The tool axis
    # q9_left_rail_joint and the passive pair carry no C3 fit and are not listed, so they get no
    # correction.
    #
    # dead_time_s is a *time*, not a sample count: the dead time is 0.06 s (pinned common,
    # wiki/hydraulic_actuator_model.md §2a) while the trajectory grid is the planner's - 0.01 s on
    # the legacy A2B path and 0.04 s on crane_planning - so counting samples would advance the
    # feedforward by four times the dead time on one of them.
    #
    # u_min/u_max bound the feedforward branch at its source. It is the one branch nothing
    # downstream bounds: the JTC's PI clamp covers only the PI, enforce_command_limits is false,
    # and the feedforward carries M_ii/k_i * qdddot_d, whose M_ii/k_i moves x132 across the
    # workspace. The values are Psi's identified domain, from the fit itself
    # (src/_archive/crane_control/calibration/velocity_characteristic.yaml, min_x/max_x per axis);
    # wiki/compensator_map.md §3 tabulates only slewing, rotator and telescope, so the boom and arm
    # numbers exist only in that record. Outside this domain the compensator extrapolates a
    # monotone spline past its data.
    c3_feedforward:
      enabled: false
      dead_time_s: 0.06
      joints:
        - theta1_slewing_joint
        - theta2_boom_joint
        - theta3_arm_joint
        - q4_big_telescope
        - theta8_rotator_joint
      k:
        - 319074.23   # N m/rad
        - 1834000.0   # N m/rad
        - 578000.0    # N m/rad
        - 3500000.0   # N/m, a geometry prior rather than a fit (controller_design.md §3.4)
        - 7296.0      # N m/rad, four bags (hydraulics §6.1) - indicative
      u_min: [-0.9635, -0.3134, -0.3342, -0.5551, -2.3969]
      u_max: [0.9357, 0.2977, 0.3059, 0.5849, 2.4636]
