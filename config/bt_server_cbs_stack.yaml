# What the behaviour-tree server must know about the *new* control stack, and
# nothing else. Kept out of `bt_server_override.yaml` on purpose: that file is
# read by the timber-backed launches too, including the real-crane one, and
# every value here is wrong for them.
/**:
  ros__parameters:
    # The joints a `FollowJointTrajectory` goal may name on this stack.
    #
    # Both A2B planners answer over the generalized eight coordinates -- the six
    # actuated axes plus `theta6_tip_joint` / `theta7_tilt_joint`, the passive
    # pair of the pendulum hinge. The timber `trajectory_controller_a2b`
    # declares all eight and commands six of them, so it takes that answer as
    # it comes. The new stack's controller is *chained* onto
    # `crane_velocity_controller` and cannot be configured that way: its
    # `command_joints` are reference-interface names carrying the inner
    # controller's prefix, and `joint_trajectory_controller` only accepts a
    # `command_joints` that is a subset of `joints` when the two differ in size
    # (`mapping()`, joint_trajectory_controller.cpp). So it declares the six
    # below, and an eight-joint goal is rejected on arrival.
    #
    # Listing them here makes the plugin drop the passive pair before it sends
    # the goal. Nothing is lost: theta6/theta7 are commanded on neither stack.
    follow_joint_trajectory:
      joints:
        - theta1_slewing_joint
        - theta2_boom_joint
        - theta3_arm_joint
        - q4_big_telescope
        - theta8_rotator_joint
        - q9_left_rail_joint
