grip_traj_server:
  ros__parameters:
    time_parameterization_algorithm: 3
    verbose: false
    moveitOptions:
      use_ruckig: false
      srdf_model: "src/epsilon_crane_moveit/config/crane_model.srdf"

/**:
  ros__parameters:
    gripOptions:
      max_q0NA_error: 0.87266
      max_qDot0NA: 0.174533
      min_zMotion: 0.800000
      xyInitErrMax: 0.800000
      minDist2ground: 0.050000
      distance_diff_saveOpen: 0.2
      theta10_unload: 0.400000
      theta10_diff_saveGrip: 0.050000
      upliftGrab: 0.500000
      upliftUnload: 1.500000
      N_approach: 15
      N_grip: 15
      N_uplift: 10
      T_init: 10.0
      compensateElasticity: true
      limit_slopes: true
    parMp:
      # index 7 is q9_left_rail_joint, rail travel in m. q9 was (rail + 0.21) * 2
      # until crane_tools_description c93b78a, so the old 0.22 asked for twice
      # the rail rate. 0.10 is gripper_max_velocity_mps, under the 0.12 URDF limit.
      qDotMinCtrl:
        [
          -0.764000,
          -0.162981,
          -0.171774,
          -0.315095,
          -100.000000,
          -100.000000,
          -2.121947,
          -0.100000,
        ]
      qDotMaxCtrl:
        [
          0.802000,
          0.119534,
          0.162867,
          0.200000,
          100.000000,
          100.000000,
          2.121947,
          0.100000,
        ]
