gripper_grasp_detector:
  ros__parameters:
    joint_states_topic: /joint_states
    output_topic: /gripper/grasp_detected
    q9_joint_name: q9_left_rail_joint

    # q9 position must be inside this inclusive window.
    position_window:
      min: 0.05
      max: 0.2

    # abs(q9 effort) must stay above this threshold for hold_time_s.
    # effort_threshold: 10000.0 # empty
    effort_threshold: 100000.0 # grasp
    hold_time_s: 1.0

    # Publish output_topic=true for this long after detection.
    signal_duration_s: 4.0
    publish_rate_hz: 10.0
