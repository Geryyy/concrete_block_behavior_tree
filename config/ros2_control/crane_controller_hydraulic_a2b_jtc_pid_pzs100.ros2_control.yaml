trajectory_controller_a2b:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController

    # The effort field of the trajectory is a feed-forward *velocity* command, not a torque:
    # u_i(t + 0.06 s) - qdot_d,i(t), i.e. C3's inversion previewed by the dead time, written by
    # crane_planning. Without this parameter the JTC rejects any trajectory that carries
    # the field, so the motion does not start rather than losing the feedforward. A trajectory
    # that does not carry it is unaffected, so this is bit-identical to before until the producer
    # runs. See wiki/controller_design.md 2.4 and wiki/implementation/jtc_fork.md delta 3.
    effort_field_is_feedforward: true

    # Freshness watchdog of ~/joint_trajectory. On `cbs_mpc_active` that topic is remapped onto
    # /crane/mpc/horizon, so it is a stream: crane_mpc republishes one horizon per Ts = 0.12 s
    # (crane_mpc.yaml; 8.3 Hz). Silence means the MPC escalated,
    # raised, crashed or was switched away, and without this the JTC plays the stale horizon
    # open-loop for the rest of its 40 x 0.12 s = 4.8 s and then holds its last knot -- velocity
    # *and* effort, which is a feed-forward velocity here, so the axes keep moving.
    # 0.24 s, and **sized on the measured gap distribution, not on a count of cycles**
    # (issue 247). What this number buys is an open-loop run at `effort` -- a feed-forward
    # velocity -- so it is a duration times a velocity, i.e. metres of tip travel with
    # nobody in the loop; a rule written in cycles doubles that every time Ts doubles.
    # Measured over two headless basic_pick_and_place runs at Ts 0.12, 1108 horizons:
    # inter-arrival p50/p90 120/126-128 ms, worst gap *while driving* 168 and 176 ms, and
    # then nothing until 510 ms -- the gaps above that are the MPC legitimately not driving
    # between moves, where firing is correct. So 0.24 s is 36 % clear of the worst observed
    # in-move gap and tolerates one lost horizon; the old 0.18 s was 2 % clear of it and
    # would have fired mid-move on a slightly worse run, which is why it could not simply be
    # left alone. The second run ran at this value and never fired it mid-move.
    # cmd_timeout cannot do this, it counts from the trajectory's last point and must exceed
    # constraints.goal_time (5.0 s below), so it would fire 4.8 + 5 s too late.
    topic_timeout: 0.24

    # These are a velocity PI, despite the names. No controller_plugin is set, so the JTC runs
    # PidTrajectoryPlugin, whose law is
    #   u = ff_velocity_scale*qd_dot + effort + p*e_pos + i*int(e_pos) + d*e_qdot
    # and on a *velocity* command interface int(e_qdot) dt == e_pos. Matching terms against
    # K_p*e_qdot + K_i*int(e_qdot) gives
    #   p == K_I   and   d == K_P
    # so `i` must stay 0 - it would integrate the position error a second time.
    # Numbers are the design of record of wiki/controller_design.md 4.1 - one fixed pair per axis,
    # margins held over the whole M_ii range and over the worst-case reading of the lag/dead-time
    # split. Not the fitted-pose pairs: a pose-blind tuning is unstable on slewing (max|z| 1.0047)
    # and, since the dead time was pinned common, on the arm (1.0044).
    #
    # u_clamp_* is Psi's own identified domain, from the fit itself
    # (src/_archive/crane_control/calibration/velocity_characteristic.yaml, min_x/max_x per axis);
    # wiki/compensator_map.md 3 tabulates only slewing, rotator and telescope. Commanding outside
    # it extrapolates a monotone spline past its data.
    #
    # TWO KNOWN DEVIATIONS from wiki/control_architecture.md 2.1, both needing a plugin change:
    # - Back-calculation there bounds the *total* command; control_toolbox clamps only the PI's
    #   own output, and the feedforward and the effort term are added outside it. The feedforward
    #   branch is bounded at its source instead, in crane_planning, so each branch is bounded but
    #   their sum is not.
    # - No `antiwindup_strategy` is set, because none would do anything: with `i: 0` the integral
    #   term of control_toolbox::Pid is identically zero, and this loop's integral action is
    #   `p * e_pos`. e_pos is a plant state, so it cannot be reset, clamped or back-calculated
    #   from here. An axis held against a stall (2.1's own failure mode) therefore accumulates
    #   e_pos at qdot_d and comes off the stall with the P term at its clamp.
    gains:
      theta1_slewing_joint:
        # A trim integrator, not a velocity loop - dominant time constant 28 s. Deliberate: Psi
        # fixes the DC gain so the feedforward alone has no steady-state velocity error, and the
        # axis is owned dynamically by the 25 Hz level. Slewing pays x17 in crossover for one fixed
        # pair, and what buys the tracking back is feedforward (x27-x44), not gain. Do not hand-tune
        # upward and do not add the M_11 schedule - a wrong gain can destabilize, a wrong
        # feedforward cannot, so the pose dependence belongs on the open-loop branch.
        ff_velocity_scale: 1.0
        p: 0.07
        i: 0.0
        d: 0.0038
        u_clamp_min: -0.9635
        u_clamp_max: 0.9357
      theta2_boom_joint:
        # Only axis with two Psi fits, and they disagree in both directions
        # (wiki/hydraulics.md 6.2/6.3): 1-D fallback [-0.3134,+0.2977], 2-D surface
        # [-0.3323,+0.2880]. Hardware runs the 2-D one. Clamp is the intersection --
        # extrapolates neither fit. Do not widen to the 2-D row without the shipped fit.
        ff_velocity_scale: 1.0
        p: 1.30
        i: 0.0
        d: 0.0945
        u_clamp_min: -0.3134   # 1-D fallback, tighter here
        u_clamp_max: 0.2880    # 2-D surface, tighter here
      theta3_arm_joint:
        # Pays x3.5 in crossover, the second-largest bill after slewing, because pinning the dead
        # time common gave this axis a delay its own fit put at zero.
        ff_velocity_scale: 1.0
        p: 1.00
        i: 0.0
        d: 0.1131
        u_clamp_min: -0.3342
        u_clamp_max: 0.3059
      q4_big_telescope:
        ff_velocity_scale: 1.0
        p: 5.14
        i: 0.0
        d: 0.3302
        u_clamp_min: -0.5551
        u_clamp_max: 0.5849
      theta8_rotator_joint:
        ff_velocity_scale: 1.0
        p: 2.35
        i: 0.0
        d: 0.1176
        u_clamp_min: -2.3969
        u_clamp_max: 2.4636
      q9_left_rail_joint:
        # The tool is deliberately not tuned - wiki/controller_design.md 1 skips it, and no campaign
        # has covered this axis, so Psi forwards it unchanged. Keep today's value: with i and d at 0
        # this stays the position-error P it has always been.
        ff_velocity_scale: 1.0
        p: 1.0
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 5.0
      theta1_slewing_joint:
        goal: 0.05
      theta2_boom_joint:
        goal: 0.05
      theta3_arm_joint:
        goal: 0.05
      q4_big_telescope:
        goal: 0.05
      theta8_rotator_joint:
        goal: 0.05
      q9_left_rail_joint:
        goal: 0.00
