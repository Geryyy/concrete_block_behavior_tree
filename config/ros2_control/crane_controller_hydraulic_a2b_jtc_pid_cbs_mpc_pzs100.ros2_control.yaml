# The deployed PID gains with the boom's and arm's p, i, d scaled by 0.5, for the two
# `cbs_mpc*` profiles only -- `cbs_mpc_jtc_overlay:=True` in pzs100_bringup.launch.py, off by
# default, and **Gazebo only**: on the machine `trajectory_controller_a2b` is started outside this
# workspace, so a human has to load this file there or set the five non-zero numbers live.
# Everything else is a copy of crane_controller_hydraulic_a2b_jtc_pid_pzs100.ros2_control.yaml,
# which stays the authority: read its comments for the clamps, the watchdog and the loop's
# structure, and change gains there only for PID mode. Generated by
# records/analysis_310/overlay.py; a test pins that this file differs from it in those six
# numbers alone. It also does not carry `lowering_pressure_interface`, which no checked-in yaml
# sets and which a machine-local file may.
#
# Why (issue 310): under `cbs_mpc*` the JTC's PI closes around the horizon's positions, which are
# the plan curve c(s), so it pulls back against the MPC's own damping motion. Bench, x2 OCP design
# model, 304 slew + a 0.1 rad tip kick, nominal plant: tip sway rate 1.5-2.5 s after arrival 47
# mrad/s at this scale against 58 at 1.0 and 51 under the shipped OCP, decay 4.9 s against 5.7 and
# 5.0. Costs ~0.025 m of final error on the one random move where the MPC is already riding its
# own rate limit.
#
# **Not a stability fix, and not measured on a plant the machine has been shown to be.** 313
# found the OCP design model is the lever and no PI scale stabilises a plant the model has wrong
# -- and on its velocity-source plant, the only bench plant that reproduces the machine's own
# instability unsaturated, a *reduced* boom/arm PI was worse than the deployed one (1.15 /cycle
# at 0.3 and 1.27 with the PI off, against 1.23 shipped). 310's grid is C3 plants only, all x1 or
# stiffer. Enable it on a loaded move only after the lab-day `u -> dq` sweep (309) says the loaded
# machine has a mode in 0.4-2.4 Hz.
trajectory_controller_a2b:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    effort_field_is_feedforward: true
    topic_timeout: 0.24
    gains:
      theta1_slewing_joint:
        ff_velocity_scale: 1.0
        p: 0.07
        i: 0.0
        d: 0.0038
        u_clamp_min: -0.9635
        u_clamp_max: 0.9357
      theta2_boom_joint:
        ff_velocity_scale: 1.0
        p: 0.25
        i: 0.05
        d: 0.05
        u_clamp_min: -0.3134
        u_clamp_max: 0.288
      theta3_arm_joint:
        ff_velocity_scale: 1.0
        p: 0.5
        i: 0.0
        d: 0.05655
        u_clamp_min: -0.3342
        u_clamp_max: 0.3059
      q4_big_telescope:
        ff_velocity_scale: 1.0
        p: 1.0
        i: 0.0
        d: 0.3302
        u_clamp_min: -0.5551
        u_clamp_max: 0.5849
      theta8_rotator_joint:
        ff_velocity_scale: 1.0
        p: 0.5
        i: 0.01
        d: 0.1176
        u_clamp_min: -2.3969
        u_clamp_max: 2.4636
      q9_left_rail_joint:
        ff_velocity_scale: 1.0
        p: 1.0
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 5.0
      theta1_slewing_joint:
        goal: 0.05
      theta2_boom_joint:
        goal: 0.05
      theta3_arm_joint:
        goal: 0.05
      q4_big_telescope:
        goal: 0.05
      theta8_rotator_joint:
        goal: 0.05
      q9_left_rail_joint:
        goal: 0.0
